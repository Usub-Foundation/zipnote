<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src qrc: 'unsafe-inline' 'unsafe-eval'; style-src 'unsafe-inline'; img-src data: blob:; font-src qrc: data:">
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<script src="qrc:/web/svg-to-png.js"></script>
<!-- themes.js, emoji.js and openiconic.js are loaded from here when a diagram first needs them -->
<script>window.PLANTUML_STDLIB_BASE = "qrc:/web/plantuml/";</script>
<script src="qrc:/web/plantuml/viz-global.js"></script>
<style>html, body { margin: 0; background: transparent; }</style>
</head>
<body>
<script type="module">
import { renderToString } from "qrc:/web/plantuml/plantuml.js";

let zn = null;

// The page under the diagram. In dark mode PlantUML paints #1B1B1B, which goes, so the note shows through as under
// Mermaid diagrams. Light renders get a white page: in the dark theme those are diagrams with colours of their own
// (C4, !theme) that need one, and in the light theme the note is white anyway. A colour the diagram sets stays.
function withPage(svg, dark) {
  const doc = new DOMParser().parseFromString(svg, "image/svg+xml");
  const root = doc.documentElement;
  const page = root.querySelector(":scope > rect");
  if (page && page.getAttribute("x") === "0" && page.getAttribute("y") === "0") {
    if (dark && /^#1b1b1b$/i.test(page.getAttribute("fill") || ""))
      page.remove();
  } else if (!dark) {
    const vb = (root.getAttribute("viewBox") || "0 0 0 0").trim().split(/[\s,]+/);
    const bg = /background(?:-color)?\s*:\s*([^;]+)/i.exec(root.getAttribute("style") || "");
    const rect = doc.createElementNS("http://www.w3.org/2000/svg", "rect");
    for (const [k, v] of [["x", vb[0]], ["y", vb[1]], ["width", vb[2]], ["height", vb[3]]])
      rect.setAttribute(k, v);
    rect.setAttribute("fill", bg ? bg[1].trim() : "#FFFFFF");
    root.insertBefore(rect, root.firstChild);
  }
  return new XMLSerializer().serializeToString(doc);
}

// PlantUML queues overlapping calls itself and answers each of them exactly once.
window.znRender = (id, source, dark) => {
  const fail = (e) => zn.done(id, false, "", String((e && e.message) || e));
  renderToString(
    source.split(/\r\n|\r|\n/),
    (svg) => svgToPng(withPage(svg, dark), 2).then((png) => zn.done(id, true, png, ""), fail),
    fail,
    { dark });
};

new QWebChannel(qt.webChannelTransport, (channel) => {
  zn = channel.objects.zn;
  zn.ready();
});
</script>
</body>
</html>
