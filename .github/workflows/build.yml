# Builds and tests ZipNotes on Linux, macOS and Windows, and packages each platform:
#   Linux    ZipNotes-linux-x86_64.AppImage  (linuxdeploy + Qt plugin)
#   macOS    ZipNotes-macos-arm64.dmg        (scripts/build-macos.sh --bundle, ad-hoc signed)
#            ZipNotes-macos-x86_64.dmg       (the same on Intel, with Qt's own binaries instead of Homebrew's)
#   Windows  ZipNotes-windows-x64.zip        (windeployqt + vcpkg DLLs)
# Each package is then started once: it creates a demo vault, opens a note with a Mermaid diagram and one with
# a PlantUML diagram, waits for Qt WebEngine to render both and saves a screenshot (smoke-<platform> artifact);
# a package that cannot start or cannot render fails the run.
# Every run uploads them as workflow artifacts; a v* tag also publishes them as a GitHub release.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: '6.10.*'
  QT_MODULES: 'qtwebengine qtwebchannel qtpositioning'

jobs:
  linux:
    name: Linux x86_64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # libzip's CMake config refers to its command-line tools, which Ubuntu ships as separate packages
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build file xvfb gdb libsodium-dev libzip-dev zipcmp zipmerge ziptool \
            libgl1-mesa-dev libegl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libfontconfig1 libdbus-1-3 \
            libnss3 libnspr4 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libxshmfence1 libgbm1 libxkbfile1 \
            libasound2t64

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          # the AppImage bundles every positioning plugin, and the NMEA one links Qt Serial Port
          modules: ${{ env.QT_MODULES }} qtserialport
          cache: true

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: AppImage
        run: |
          DESTDIR="$PWD/AppDir" cmake --install build
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-*.AppImage
          export APPIMAGE_EXTRACT_AND_RUN=1 QMAKE="$QT_ROOT_DIR/bin/qmake" EXTRA_QT_MODULES=svg EXTRA_QT_PLUGINS=svg
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --plugin qt --output appimage \
            --desktop-file packaging/linux/zipnotes.desktop --icon-file resources/icons/zipnotes.svg
          mv ZipNotes*.AppImage ZipNotes-linux-x86_64.AppImage

      # runs as the unprivileged runner user with the Chromium sandbox on, like on a user's machine;
      # if the AppImage does not start, the step prints a backtrace and tries the unpackaged binary for comparison
      - name: Smoke test
        env:
          ZN_PW: ci-smoke-password
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          smoke() {  # smoke <program> [wrapper...]: create a demo vault, open the diagram notes, save a screenshot
            rm -f "$RUNNER_TEMP/smoke.zip" "$RUNNER_TEMP/smoke.zip.lock" smoke-linux.png
            env -u LD_LIBRARY_PATH -u QT_PLUGIN_PATH -u QML2_IMPORT_PATH \
              timeout 300 xvfb-run -a -s "-screen 0 1600x1000x24" "${@:2}" "$1" "$RUNNER_TEMP/smoke.zip" \
              --password-env ZN_PW --create-demo --size 1320x840 --steps "search:hub;wait:3000;escape;search:lisbon;wait:3000;diagrams:90000" --screenshot "$PWD/smoke-linux.png"
          }
          if smoke ./ZipNotes-linux-x86_64.AppImage && test -s smoke-linux.png; then
            exit 0
          fi
          echo "::error::the AppImage did not start"
          ./ZipNotes-linux-x86_64.AppImage --appimage-extract >/dev/null
          echo "::group::extracted AppImage under gdb"
          QTWEBENGINE_CHROMIUM_FLAGS="--enable-logging=stderr --v=0" QT_DEBUG_PLUGINS=1 \
            smoke squashfs-root/usr/bin/ZipNotes gdb -q -batch -ex run -ex "thread apply all bt 30" --args || true
          echo "::endgroup::"
          echo "::group::unpackaged build/ZipNotes"
          smoke build/ZipNotes && echo "exit code 0" || echo "exit code $?"
          echo "::endgroup::"
          exit 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-linux
          path: smoke-linux.png
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: ZipNotes-linux-x86_64
          path: ZipNotes-linux-x86_64.AppImage
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          # Homebrew stopped building Intel bottles (Tier 3 since September 2026): its Qt would be compiled
          # from source for hours, so the Intel build takes Qt from install-qt-action like Linux and Windows
          - arch: x86_64
            runner: macos-15-intel
            official-qt: true
    env:
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      HOMEBREW_NO_ENV_HINTS: 1
    steps:
      - uses: actions/checkout@v4

      # sets QT_ROOT_DIR, which build-macos.sh uses instead of Homebrew's Qt
      - uses: jurplel/install-qt-action@v4
        if: matrix.official-qt
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: desktop
          arch: clang_64
          modules: ${{ env.QT_MODULES }}
          cache: true

      # the same script users run locally: Homebrew dependencies, build, tests, macdeployqt, .dmg
      - name: Build, test and bundle
        run: scripts/build-macos.sh --bundle

      - name: Rename
        run: mv build-macos/ZipNotes.dmg ZipNotes-macos-${{ matrix.arch }}.dmg

      # the bundle after macdeployqt, i.e. what the .dmg contains; macOS has no timeout(1), perl's alarm does it
      - name: Smoke test
        env:
          ZN_PW: ci-smoke-password
        run: |
          perl -e 'alarm 180; exec @ARGV' build-macos/ZipNotes.app/Contents/MacOS/ZipNotes "$RUNNER_TEMP/smoke.zip" \
            --password-env ZN_PW --create-demo --size 1320x840 --steps "search:hub;wait:3000;escape;search:lisbon;wait:3000;diagrams:90000" --screenshot "$PWD/smoke-macos.png"
          test -s smoke-macos.png

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-macos-${{ matrix.arch }}
          path: smoke-macos.png
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: ZipNotes-macos-${{ matrix.arch }}
          path: ZipNotes-macos-${{ matrix.arch }}.dmg
          if-no-files-found: error

  windows:
    name: Windows x64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: ${{ env.QT_MODULES }}
          cache: true

      - name: libsodium and libzip
        shell: pwsh
        run: '& "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install libsodium:x64-windows libzip:x64-windows'

      - name: Configure
        shell: pwsh
        run: >
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        shell: pwsh
        run: |
          cmake --install build --config Release --prefix dist
          windeployqt --release --no-translations dist/bin/ZipNotes.exe
          Copy-Item "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin/*.dll" dist/bin/
          Copy-Item README.md, LICENSE dist/
          Compress-Archive -Path dist/* -DestinationPath ZipNotes-windows-x64.zip

      # ZipNotes.exe is a GUI program, so start it as a process and wait for it explicitly
      - name: Smoke test
        shell: pwsh
        env:
          ZN_PW: ci-smoke-password
        run: |
          $p = Start-Process -FilePath dist/bin/ZipNotes.exe -PassThru -ArgumentList @(
            "$env:RUNNER_TEMP\smoke.zip", '--password-env', 'ZN_PW', '--create-demo', '--size', '1320x840',
            '--steps', 'search:hub;wait:3000;escape;search:lisbon;wait:3000;diagrams:90000', '--screenshot', "$PWD\smoke-windows.png")
          $null = $p.Handle  # keeps the handle so ExitCode is available after the wait
          if (-not $p.WaitForExit(180000)) { $p.Kill(); throw 'ZipNotes did not exit within 3 minutes' }
          if ($p.ExitCode -ne 0) { throw "ZipNotes exited with code $($p.ExitCode)" }
          if (-not (Test-Path smoke-windows.png)) { throw 'ZipNotes saved no screenshot' }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-windows
          path: smoke-windows.png
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: ZipNotes-windows-x64
          path: ZipNotes-windows-x64.zip
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, macos, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ZipNotes-*
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
